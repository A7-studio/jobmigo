[project]
name = "jobmigo-engine"
version = "0.1.0"
description = "Jobmigo AI engine: the internal Python service behind the web app."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic>=2.14.3",
    "starlette>=1.10.0",
    "httpx",
    "boto3>=1.43.126",
    "pypdf>=7.0.0",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Adapted third-party code: long pattern lines and the invisible characters it lists.
"src/engine/jobs/posting_guard.py" = ["E501", "RUF001", "RUF003"]
"src/engine/jobs/robots.py" = ["E501"]
# Address literals and long fixture lines are the point of these tests.
"tests/test_fetch.py" = ["E501", "S104"]
"tests/test_robots.py" = ["E501", "S311"]
"tests/test_posting_guard.py" = ["E501"]
"tests/test_jobs_fetch_route.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "boto3", "boto3.*", "botocore", "botocore.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true
