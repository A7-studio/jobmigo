services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: jobmigo
      POSTGRES_PASSWORD: jobmigo
      POSTGRES_DB: jobmigo
    ports:
      - "5442:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmigo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://jobmigo:jobmigo@db:5432/jobmigo
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  dbdata:
