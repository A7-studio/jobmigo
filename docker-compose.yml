services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: jobmigo
      POSTGRES_PASSWORD: jobmigo
      POSTGRES_DB: jobmigo
    ports:
      - "5442:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmigo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible object storage for CVs (production uses R2 or B2).
  # RustFS replaces MinIO, whose images are no longer published. The engine creates the
  # bucket on first write in local development. Pinned by digest and bound to this
  # machine only (it holds real CV files).
  storage:
    image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: jobmigo
      RUSTFS_SECRET_KEY: jobmigo-dev-secret
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - storagedata:/data

  # The Python AI engine. Internal only in production; published on this machine
  # alone here so the web dev server can reach it.
  engine:
    build:
      context: ./engine
    environment:
      DATABASE_URL: postgresql://jobmigo:jobmigo@db:5432/jobmigo
      ENGINE_TOKEN: ${ENGINE_TOKEN:-}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      AI_CHEAP_MODEL: ${AI_CHEAP_MODEL:-}
      AI_STRONG_MODEL: ${AI_STRONG_MODEL:-}
      AI_CHEAP_PRICE: ${AI_CHEAP_PRICE:-}
      AI_STRONG_PRICE: ${AI_STRONG_PRICE:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      # Inside the compose network the store is `storage`; signed download links are built
      # for the address the browser can reach.
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9100}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-jobmigo}
      STORAGE_KEY: ${STORAGE_KEY:-jobmigo}
      STORAGE_SECRET: ${STORAGE_SECRET:-jobmigo-dev-secret}
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://jobmigo:jobmigo@db:5432/jobmigo
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      BETTER_AUTH_URL: http://localhost:3000
      ENVIRONMENT: ${ENVIRONMENT:-local}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ENGINE_URL: http://engine:8000
      ENGINE_TOKEN: ${ENGINE_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  storagedata:
