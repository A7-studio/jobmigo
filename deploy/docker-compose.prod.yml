# Production stack: Postgres, the app, and Caddy for HTTPS. Only Caddy publishes ports.
# Always run with the env file:  docker compose --env-file .env.production -f docker-compose.prod.yml ...
name: jobmigo-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobmigo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: jobmigo
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmigo -d jobmigo"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The AI engine: internal network only. Nothing here publishes a port.
  engine:
    build:
      context: ../engine
    image: jobmigo-engine:prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jobmigo:${POSTGRES_PASSWORD}@db:5432/jobmigo
      ENGINE_TOKEN: ${ENGINE_TOKEN:-}
      ENVIRONMENT: production
      AI_CHEAP_MODEL: ${AI_CHEAP_MODEL:-}
      AI_STRONG_MODEL: ${AI_STRONG_MODEL:-}
      AI_CHEAP_PRICE: ${AI_CHEAP_PRICE:-}
      AI_STRONG_PRICE: ${AI_STRONG_PRICE:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_KEY: ${STORAGE_KEY:-}
      STORAGE_SECRET: ${STORAGE_SECRET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
    image: jobmigo-web:prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://jobmigo:${POSTGRES_PASSWORD}@db:5432/jobmigo
      # The entrypoint refuses TRUST_PROXY_HEADERS=true unless CLOUDFLARE_ONLY=true.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      CLOUDFLARE_ONLY: ${CLOUDFLARE_ONLY:-false}
      ENGINE_URL: http://engine:8000
      ENGINE_TOKEN: ${ENGINE_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.production}
      CLOUDFLARE_ONLY: ${CLOUDFLARE_ONLY:-false}
    volumes:
      # A directory mount (not single files) so `caddy reload` sees updated files.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  dbdata:
  caddy_data:
  caddy_config:
